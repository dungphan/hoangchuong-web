{{- $s := hugo.Data.settings -}}
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">{{ $s.site_title }}</a>
    <div class="right">
      <nav>
        {{- range $s.nav }}
        <a href="{{ .url | relURL }}">{{ .label }}</a>
        {{- end }}
      </nav>
      {{- /* Rendered hidden; theme.js reveals it. Without JS the site still
             follows the system preference, so a dead button would be worse
             than none. */ -}}
      <button type="button" class="theme-toggle" id="theme-toggle" hidden
              aria-label="Đổi giao diện sáng/tối">
        <svg class="to-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="to-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 1.8v2.4M12 19.8v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>
        </svg>
      </button>
    </div>
  </div>
</header>
