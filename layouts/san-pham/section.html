{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ with .Params.intro }}<p>{{ . }}</p>{{ end }}
<div class="catalogue">
  {{ partial "category-sidebar.html" . }}
  <div class="catalogue-main">
    <div class="grid">
      {{- range .Pages }}
        {{ partial "project-card.html" . }}
      {{- end }}
    </div>
  </div>
</div>
{{ end }}
