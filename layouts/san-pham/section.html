{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ with .Params.intro }}<p>{{ . }}</p>{{ end }}
<div class="catalogue">
  {{ partial "category-sidebar.html" . }}
  <div class="catalogue-main">
    <div class="grid">
      {{- $paginator := .Paginate .Pages }}
      {{- range $paginator.Pages }}
        {{ partial "product-card.html" . }}
      {{- end }}
    </div>
    {{ template "_internal/pagination.html" . }}
  </div>
</div>
{{ end }}
