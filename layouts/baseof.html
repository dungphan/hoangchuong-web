<!doctype html>
<html lang="vi">
<head>
{{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main id="content" class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
{{- with resources.Get "js/theme.js" }}
  {{- $js := . | minify | fingerprint -}}
  <script type="module" src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
{{- end }}
</body>
</html>
